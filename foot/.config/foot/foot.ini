term=foot

app-id=foot
title=foot
locked-title=no

font=Hack Nerd Font:size=11
font-size-adjustment=0.5
letter-spacing=0
horizontal-letter-offset=0
vertical-letter-offset=0
box-drawings-uses-font-glyphs=no
dpi-aware=no
gamma-correct-blending=no

initial-color-theme=dark
initial-window-size-pixels=700x500
initial-window-mode=windowed
pad=0x0 center-when-maximized-and-fullscreen
resize-by-cells=yes
resize-keep-grid=yes
resize-delay-ms=100

[bell]
system=yes
urgent=no
notify=no
visual=no

[scrollback]
lines=1000
multiplier=3.0
indicator-position=relative
indicator-format=""

[cursor]
style=block
blink=no
blink-rate=500
beam-thickness=1.5

[mouse]
hide-when-typing=no
alternate-scroll-mode=yes

[colors-dark]
background=080808
foreground=bdbdbd

# Selection
selection-background=b2ceee
selection-foreground=080808

# Normal colors
regular0=323437
regular1=ff5d5d
regular2=8cc85f
regular3=e3c78a
regular4=80a0ff
regular5=cf87e8
regular6=79dac8
regular7=c6c6c6

# Bright colors
bright0=949494
bright1=ff5189
bright2=36c692
bright3=c6c684
bright4=74b2ff
bright5=ae81ff
bright6=85dc85
bright7=e4e4e4
