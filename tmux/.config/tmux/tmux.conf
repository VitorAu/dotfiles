unbind r
bind r source-file ~/.config/tmux/tmux.conf

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g prefix C-s
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g  default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"
set -g renumber-windows on
set -g status-position top
set -g status-style "bg=#262627,fg=#d3d3d3, bright"
set -g status-left ""
set -g status-right " #S | #{host} | %H:%M %d-%b-%y "
set -g status-right-style "bg=#608b4e,fg=#262626"
set -g status-right-style "bg=#608b4e,fg=#262626"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator "#[bg=#608b4e, fg=#262626]|"
set -g window-status-style "bg=#608b4e,fg=#464646"
set -g window-status-current-style "bg=#608b4e, fg=#262626, bold"

bind-key -n C-S-Left  resize-pane -L 5
bind-key -n C-S-Down  resize-pane -D 5
bind-key -n C-S-Up    resize-pane -U 5
bind-key -n C-S-Right resize-pane -R 5
bind-key -n C-Left  resize-pane -L 1
bind-key -n C-Down  resize-pane -D 1
bind-key -n C-Up    resize-pane -U 1
bind-key -n C-Right resize-pane -R 1

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
run '~/.tmux/plugins/tpm/tpm'
